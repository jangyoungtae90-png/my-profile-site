<!DOCTYPE html>
<html>
<meta charset="utf-8"/>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  /* ── Variables ── */
  :root {
    --purple-deep:   #2D1B7E;
    --purple-mid:    #5B21B6;
    --purple-light:  #8B5CF6;
    --purple-pale:   #C4B5FD;
    --purple-frost:  #EDE9FE;
    --rose-gold:     #E8B4C0;
    --rose-deep:     #C47A8A;
    --gold:          #D4AF6A;
    --cream:         #FAF8FF;
    --white:         #FFFFFF;
    --text-primary:  #1A1035;
    --text-secondary:#6B5E8C;
    --text-muted:    #A89DC0;
    --border-soft:   rgba(91, 33, 182, 0.12);
    --shadow-sm:     0 2px 12px rgba(45, 27, 126, 0.08);
    --shadow-md:     0 6px 28px rgba(45, 27, 126, 0.14);
    --grad-main:     linear-gradient(135deg, #2D1B7E 0%, #5B21B6 50%, #8B5CF6 100%);
    --grad-rose:     linear-gradient(135deg, #5B21B6 0%, #C47A8A 100%);
    --grad-gold:     linear-gradient(135deg, #5B21B6 0%, #D4AF6A 100%);
    --grad-soft:     linear-gradient(135deg, #EDE9FE 0%, #FAF8FF 100%);

    /* iPad Mini 5 portrait baseline */
    --app-width: 720px;
    --app-pad:   24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    background: var(--cream);
    color: var(--text-primary);
  }

  /* ── Page wrapper: full-height centered column ── */
  .page-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── App Header ── */
  .app-header {
    width: 100%;
    background: var(--grad-main);
    padding: 28px var(--app-pad) 36px;
    position: relative;
    overflow: hidden;
  }
  .app-header::before {
    content: '';
    position: absolute;
    top: -70px; right: -50px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    pointer-events: none;
  }
  .app-header::after {
    content: '';
    position: absolute;
    bottom: -50px; left: 28%;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    pointer-events: none;
  }
  .app-header-inner {
    position: relative;
    z-index: 1;
    max-width: var(--app-width);
    margin: 0 auto;
  }
  .app-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .app-brand-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--rose-gold);
    box-shadow: 0 0 8px var(--rose-gold);
  }
  .app-brand-name {
    font-size: 0.68em;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
  }
  .app-title {
    font-size: 1.85em;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
    margin-bottom: 5px;
  }
  .app-subtitle {
    font-size: 0.8em;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
  }

  /* ── App Body: centered column, iPad-width ── */
  .app-body {
    width: 100%;
    max-width: var(--app-width);
    padding: 28px var(--app-pad) 48px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── YMK Module: centered ── */
  .module-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-bottom: 4px;
  }
  #YMK-module {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    text-align: center;
  }
  #YMK-module > * {
    margin-left: auto;
    margin-right: auto;
  }

  /* ── Single CTA: Skin Analysis ── */
  .cta-section {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px 0 4px;
  }
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 48px;
    background: var(--grad-main);
    color: #fff;
    font-size: 1em;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(45,27,126,0.32);
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    user-select: none;
  }
  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(45,27,126,0.42);
  }
  .cta-btn:active {
    transform: translateY(0);
    opacity: 0.9;
  }
  .cta-btn-icon {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85em;
    flex-shrink: 0;
  }

  /* ── Divider between CTA and results ── */
  .results-divider {
    width: 100%;
    height: 1px;
    background: var(--border-soft);
    margin: 28px 0 0;
  }

  /* ── Result Panel ── */
  #skincare-result {
    display: none;
    width: 100%;
  }

  .result-section {
    margin-bottom: 32px;
  }
  .result-section-title {
    font-size: 0.68em;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .result-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-soft);
  }

  /* ── Overview: 3-up on iPad Mini portrait ── */
  .skin-overview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  /* 4-card fallback: 2×2 */
  .skin-overview.four-cards {
    grid-template-columns: repeat(4, 1fr);
  }
  .skin-overview-card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    padding: 20px 14px 18px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .skin-overview-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .skin-overview-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 18px 18px 0 0;
    background: var(--grad-main);
  }
  .skin-overview-card:nth-child(2)::before { background: var(--grad-rose); }
  .skin-overview-card:nth-child(3)::before { background: var(--grad-gold); }
  .skin-overview-card:nth-child(4)::before { background: linear-gradient(135deg,#2D1B7E,#C4B5FD); }
  .skin-overview-card .label {
    font-size: 0.65em;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .skin-overview-card .value {
    font-size: 2em;
    font-weight: 700;
    background: var(--grad-main);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 5px;
  }
  .skin-overview-card:nth-child(3) .value {
    font-size: 1.3em;
    letter-spacing: -0.01em;
  }
  .skin-overview-card .sub {
    font-size: 0.7em;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  /* ── Concern Scores: 3-col on iPad Mini portrait ── */
  .score-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .score-item {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .score-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .score-item .score-label {
    font-size: 0.72em;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
    letter-spacing: 0.03em;
  }
  .score-item .score-bar-wrap {
    background: var(--purple-frost);
    border-radius: 99px;
    height: 5px;
    width: 100%;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .score-item .score-bar {
    height: 5px;
    border-radius: 99px;
    background: var(--grad-main);
    transition: width 0.85s cubic-bezier(0.4,0,0.2,1);
  }
  .score-item .score-num {
    font-size: 0.78em;
    font-weight: 700;
    color: var(--purple-mid);
  }
  .score-item .score-num span {
    font-weight: 400;
    color: var(--text-muted);
  }

  /* ── Recommendations: 2-col on iPad Mini portrait ── */
  .rec-section-head {
    font-size: 0.88em;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 14px;
  }
  .rec-products {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .rec-card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .rec-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .rec-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--grad-main);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .rec-card:hover::after { opacity: 1; }
  .rec-card .rec-upc {
    font-size: 0.64em;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .rec-card .rec-id {
    font-size: 0.9em;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 10px;
  }
  .rec-card .rec-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 6px;
  }
  .rec-card .rec-tag {
    background: var(--purple-frost);
    color: var(--purple-mid);
    font-size: 0.68em;
    font-weight: 600;
    border-radius: 6px;
    padding: 3px 8px;
    letter-spacing: 0.04em;
  }
  .rec-card .rec-weight {
    font-size: 0.68em;
    color: var(--text-muted);
    margin-top: 8px;
    font-weight: 500;
  }

  /* ── Empty state ── */
  .empty-state {
    width: 100%;
    text-align: center;
    padding: 52px 0 36px;
  }
  .empty-state-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: var(--grad-soft);
    border: 2px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 2.2em;
  }
  .empty-state h3 {
    font-size: 1.05em;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .empty-state p {
    font-size: 0.82em;
    line-height: 1.7;
    color: var(--text-muted);
    max-width: 280px;
    margin: 0 auto;
  }

  /* ── Raw JSON toggle ── */
  .raw-toggle-wrap {
    width: 100%;
    margin-top: 24px;
    border-top: 1px solid var(--border-soft);
    padding-top: 16px;
  }
  #raw-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7em;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    letter-spacing: 0.07em;
    transition: color 0.2s;
    user-select: none;
  }
  #raw-toggle:hover { color: var(--purple-mid); }
  #raw-json {
    display: none;
    background: #130D2E;
    color: #C4B5FD;
    font-size: 0.72em;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    border-radius: 12px;
    padding: 16px;
    margin-top: 10px;
    overflow: auto;
    max-height: 280px;
    white-space: pre;
    border: 1px solid rgba(196,181,253,0.1);
    box-shadow: var(--shadow-sm);
  }

  /* ── No-rec placeholder ── */
  .no-rec-box {
    background: var(--purple-frost);
    border-radius: 14px;
    padding: 18px 22px;
  }
  .no-rec-box p {
    font-size: 0.82em;
    line-height: 1.7;
    color: var(--text-secondary);
  }

  /* ── Hidden dev controls (preserved for JS) ── */
  .dev-hidden { display: none !important; }
</style>
</head>
<body>

<div class="page-wrap">

  <!-- ── App Header ── -->
  <div class="app-header">
    <div class="app-header-inner">
      <div class="app-brand">
        <div class="app-brand-dot"></div>
        <span class="app-brand-name">Beauty Device · AI Analysis</span>
      </div>
      <div class="app-title">Skin Diagnostic</div>
      <div class="app-subtitle">Powered by YMK Skin Analysis Engine</div>
    </div>
  </div>

  <!-- ── App Body: max-width 720px, centered ── -->
  <div class="app-body">

    <!-- YMK AR Module (centered) -->
    <div class="module-wrap">
      <div id="YMK-module"></div>
    </div>

    <!-- Single CTA: Skin Analysis only -->
    <div class="cta-section">
      <button class="cta-btn" onclick="clearResult(); YMK.openSkincare()">
        <span class="cta-btn-icon">✦</span>
        Skin Analysis
      </button>
    </div>

    <!-- Divider (visible only after result) -->
    <div class="results-divider" id="results-divider" style="display:none;"></div>

    <!-- Empty state (before analysis) -->
    <div id="empty-state" class="empty-state">
      <div class="empty-state-ring">✦</div>
      <h3>Ready for Skin Analysis</h3>
      <p>Tap <strong>Skin Analysis</strong> to begin your AI-powered diagnostic session.</p>
    </div>

    <!-- ── Result Panel ── -->
    <div id="skincare-result">

      <!-- 1. Overview -->
      <div class="result-section">
        <div class="result-section-title">Overview</div>
        <div class="skin-overview" id="sc-overview"></div>
      </div>

      <!-- 2. Concern Scores -->
      <div class="result-section">
        <div class="result-section-title">Concern Scores</div>
        <div id="sc-scores" class="score-grid"></div>
      </div>

      <!-- 3. Recommendations -->
      <div class="result-section">
        <div class="result-section-title">Recommendations</div>
        <div id="sc-recommendation"></div>
      </div>

      <!-- Raw JSON debug -->
      <div class="raw-toggle-wrap">
        <span id="raw-toggle" onclick="
          var el = document.getElementById('raw-json');
          el.style.display = el.style.display === 'none' ? 'block' : 'none';
          this.textContent = el.style.display === 'none' ? '▶  Show raw JSON' : '▼  Hide raw JSON';
        ">▶  Show raw JSON</span>
        <pre id="raw-json"></pre>
      </div>

    </div><!-- /#skincare-result -->

  </div><!-- /.app-body -->

</div><!-- /.page-wrap -->

<!-- Hidden dev inputs (SDK callbacks need these) -->
<div class="dev-hidden">
  <input type="text" id="itemGuid" value=""/>
</div>

<!-- ── SDK Loader ── -->
<script>
  (function (d,k) {
    var s = d.createElement('script');
    s.type = 'text/javascript';
    s.async = true;
    s.src = 'https://plugins-media.makeupar.com/c56536-dev/sdk.js?apiKey=' + k;
    var x = d.getElementsByTagName('script')[0];
    x.parentNode.insertBefore(s, x);
  })(document, '079ovYZ0iE7UhO574L9zvA');
</script>

<script>
/* ── Score labels ── */
var SCORE_LABELS = {
  acne:              'Acne',
  darkCircles:       'Dark Circles',
  darkCirclesV2:     'Dark Circles V2',
  moisture:          'Moisture',
  oiliness:          'Oiliness',
  redness:           'Redness',
  ageSpots:          'Age Spots',
  texture:           'Texture',
  wrinkles:          'Wrinkles',
  wrinklesV2:        'Wrinkles V2',
  eyeBags:           'Eye Bags',
  droopyUpperEyelid: 'Droopy Upper Eyelid',
  droopyLowerEyelid: 'Droopy Lower Eyelid',
  firmness:          'Firmness',
  radiance:          'Radiance',
  pore:              'Pore',
  teartrough:        'Tear Trough',
};

/* ── Render result panel ── */
function renderSkincareResult(report) {
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('results-divider').style.display = 'block';
  document.getElementById('skincare-result').style.display = 'block';

  /* Overview */
  var overviewEl = document.getElementById('sc-overview');
  var overviewHtml = '';
  if (report.skinHealth !== undefined) overviewHtml += overviewCard('Skin Health', report.skinHealth, '/ 100');
  if (report.skinAge     !== undefined) overviewHtml += overviewCard('Skin Age',    report.skinAge,    'years');
  if (report.skinType)                  overviewHtml += overviewCard('Skin Type',   report.skinType,   '');
  if (report.fitzpatrickScale)          overviewHtml += overviewCard('Fitzpatrick', 'Type ' + report.fitzpatrickScale, '');
  overviewEl.innerHTML = overviewHtml;

  /* 4-card: switch to 4-col */
  var cardCount = overviewEl.querySelectorAll('.skin-overview-card').length;
  if (cardCount === 4) overviewEl.classList.add('four-cards');
  else overviewEl.classList.remove('four-cards');

  /* Concern scores */
  var gridHtml = '';
  Object.keys(SCORE_LABELS).forEach(function(key) {
    var val = report[key];
    if (val === undefined || val === null) return;
    gridHtml += scoreItem(SCORE_LABELS[key], parseFloat(val));
  });
  document.getElementById('sc-scores').innerHTML = gridHtml ||
    '<p style="color:var(--text-muted);font-size:0.82em;grid-column:1/-1;padding:12px 0;">No concern scores returned.</p>';

  /* Recommendations */
  var recSection = document.getElementById('sc-recommendation');
  if (report.recommendation && report.recommendation.products && report.recommendation.products.length > 0) {
    var recHtml = '';
    report.recommendation.products.forEach(function(p) {
      var tags = (p.sources || []).map(function(s) {
        return '<span class="rec-tag">' + s + '</span>';
      }).join('');
      var weight = p.weight !== undefined ? '<div class="rec-weight">Weight: ' + p.weight + '</div>' : '';
      recHtml +=
        '<div class="rec-card">' +
          '<div class="rec-upc">UPC: ' + (p.upc || '—') + '</div>' +
          '<div class="rec-id">Product #' + p.productId + '</div>' +
          '<div class="rec-tags">' + tags + '</div>' +
          weight +
        '</div>';
    });
    recSection.innerHTML =
      '<div class="rec-section-head">Recommended Products ' +
        '<span style="color:var(--purple-light);font-size:0.85em;">(' + report.recommendation.products.length + ')</span>' +
      '</div>' +
      '<div class="rec-products">' + recHtml + '</div>';
  } else {
    recSection.innerHTML =
      '<div class="no-rec-box"><p>' +
        'No product recommendations returned.<br>' +
        '<span style="color:var(--text-muted);">Configure recommendation rules on Perfect Console to enable this.</span>' +
      '</p></div>';
  }

  /* Raw JSON */
  document.getElementById('raw-json').textContent = JSON.stringify(report, null, 2);
}

function overviewCard(label, value, sub) {
  return '<div class="skin-overview-card">' +
    '<div class="label">' + label + '</div>' +
    '<div class="value">' + value + '</div>' +
    (sub ? '<div class="sub">' + sub + '</div>' : '') +
    '</div>';
}

function scoreItem(label, val) {
  var pct = Math.min(100, Math.max(0, val));
  return '<div class="score-item">' +
    '<div class="score-label">' + label + '</div>' +
    '<div class="score-bar-wrap"><div class="score-bar" style="width:' + pct + '%"></div></div>' +
    '<div class="score-num">' + val + ' <span>/ 100</span></div>' +
    '</div>';
}

/* ── SDK init ── */
window.ymkAsyncInit = function() {
  window.YMK.init({ autoOpen: false });

  window.YMK.addEventListener('videoLoaded',         function()  { console.log('videoLoaded'); });
  window.YMK.addEventListener('photoLoaded',         function()  { console.log('photoLoaded'); });
  window.YMK.addEventListener('shadeFinderComplete', function(r) { console.log('shadeFinderComplete', r); });

  window.YMK.addEventListener('skinAnalysisCompleted', function(report) {
    console.log('skinAnalysisCompleted', report);
    renderSkincareResult(report);
  });

  window.YMK.addEventListener('skinAnalysisUpdated', function(report) {
    console.log('skinAnalysisUpdated (fallback)', report);
    if (document.getElementById('skincare-result').style.display === 'none') {
      renderSkincareResult(report);
    }
  });
};

function applyMakeupManual() {
  YMK.applyMakeupBySku(document.getElementById('itemGuid').value);
}

function clearResult() {
  document.getElementById('skincare-result').style.display = 'none';
  document.getElementById('results-divider').style.display = 'none';
  document.getElementById('empty-state').style.display = 'block';
}
</script>

</body>
</html>
