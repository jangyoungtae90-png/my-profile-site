<!DOCTYPE html>
<html>
<meta charset="utf-8"/>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  /* ── Variables ── */
  :root {
    --purple-deep:   #2D1B7E;
    --purple-mid:    #5B21B6;
    --purple-light:  #8B5CF6;
    --purple-pale:   #C4B5FD;
    --purple-frost:  #EDE9FE;
    --rose-gold:     #E8B4C0;
    --rose-deep:     #C47A8A;
    --gold:          #D4AF6A;
    --cream:         #FAF8FF;
    --white:         #FFFFFF;
    --text-primary:  #1A1035;
    --text-secondary:#6B5E8C;
    --text-muted:    #A89DC0;
    --border-soft:   rgba(91, 33, 182, 0.12);
    --shadow-sm:     0 2px 12px rgba(45, 27, 126, 0.08);
    --shadow-md:     0 6px 28px rgba(45, 27, 126, 0.14);
    --grad-main:     linear-gradient(135deg, #2D1B7E 0%, #5B21B6 50%, #8B5CF6 100%);
    --grad-rose:     linear-gradient(135deg, #5B21B6 0%, #C47A8A 100%);
    --grad-gold:     linear-gradient(135deg, #5B21B6 0%, #D4AF6A 100%);
    --grad-soft:     linear-gradient(135deg, #EDE9FE 0%, #FAF8FF 100%);

    --app-width: 720px;
    --app-pad:   24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
    background: var(--cream);
    color: var(--text-primary);
  }

  .page-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── App Header ── */
  .app-header {
    width: 100%;
    background: var(--grad-main);
    padding: 28px var(--app-pad) 36px;
    position: relative;
    overflow: hidden;
  }
  .app-header::before {
    content: '';
    position: absolute;
    top: -70px; right: -50px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    pointer-events: none;
  }
  .app-header::after {
    content: '';
    position: absolute;
    bottom: -50px; left: 28%;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    pointer-events: none;
  }
  .app-header-inner {
    position: relative;
    z-index: 1;
    max-width: var(--app-width);
    margin: 0 auto;
    text-align: center;
  }
  .app-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .app-brand-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--rose-gold);
    box-shadow: 0 0 8px var(--rose-gold);
  }
  .app-brand-name {
    font-size: 0.68em;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
  }
  .app-title {
    font-size: clamp(1.1em, 3.8vw, 1.5em);
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  /* ── App Body ── */
  .app-body {
    width: 100%;
    max-width: var(--app-width);
    padding: 28px var(--app-pad) 48px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── YMK Module: premium framed view ── */
  .module-wrap {
    width: 100%;
    text-align: center;
    padding: 10px 0 6px; /* room for outer glow */
    margin-bottom: 4px;
  }

  /* Gradient border frame */
  .module-frame {
    display: inline-block;
    border-radius: 32px;
    padding: 3px;                          /* gradient border thickness */
    background: var(--grad-main);
    box-shadow:
      0 0 0 6px rgba(91, 33, 182, 0.10),  /* outer soft purple ring */
      0 0 0 7px rgba(45, 27, 126, 0.04),  /* second faint ring */
      0 18px 52px rgba(45, 27, 126, 0.24);/* elevation shadow */
    position: relative;
  }

  /* Top-edge shine overlay (glass reflection) */
  .module-frame::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 29px;
    background: linear-gradient(
      180deg,
      rgba(255,255,255,0.14) 0%,
      rgba(255,255,255,0.04) 30%,
      transparent 60%
    );
    pointer-events: none;
    z-index: 2;
  }

  /* Inner clip container — rounds SDK content corners */
  .module-inner {
    display: inline-block;
    border-radius: 29px;
    overflow: hidden;
    vertical-align: top;
    position: relative;
  }

  #YMK-module {
    display: block;
    text-align: left;
  }

  /* ── Single CTA ── */
  .cta-section {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px 0 4px;
  }
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 48px;
    background: var(--grad-main);
    color: #fff;
    font-size: 1em;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(45,27,126,0.32);
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    user-select: none;
  }
  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(45,27,126,0.42);
  }
  .cta-btn:active { transform: translateY(0); opacity: 0.9; }
  .cta-btn-icon {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85em;
    flex-shrink: 0;
  }

  /* ── Divider ── */
  .results-divider {
    width: 100%;
    height: 1px;
    background: var(--border-soft);
    margin: 28px 0 0;
  }

  /* ── Result Panel ── */
  #skincare-result {
    display: none;
    width: 100%;
  }
  .result-section { margin-bottom: 32px; }
  .result-section-title {
    font-size: 0.68em;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .result-section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-soft);
  }

  /* ── Overview ── */
  .skin-overview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .skin-overview.four-cards { grid-template-columns: repeat(4, 1fr); }
  .skin-overview-card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    padding: 20px 14px 18px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .skin-overview-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .skin-overview-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 18px 18px 0 0;
    background: var(--grad-main);
  }
  .skin-overview-card:nth-child(2)::before { background: var(--grad-rose); }
  .skin-overview-card:nth-child(3)::before { background: var(--grad-gold); }
  .skin-overview-card:nth-child(4)::before { background: linear-gradient(135deg,#2D1B7E,#C4B5FD); }
  .skin-overview-card .label {
    font-size: 0.65em; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 10px;
  }
  .skin-overview-card .value {
    font-size: 2em; font-weight: 700;
    background: var(--grad-main);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; line-height: 1; margin-bottom: 5px;
  }
  .skin-overview-card:nth-child(3) .value { font-size: 1.3em; }
  .skin-overview-card .sub { font-size: 0.7em; color: var(--text-muted); letter-spacing: 0.04em; }

  /* ── Concern Scores ── */
  .score-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .score-item {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .score-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .score-item .score-label { font-size: 0.72em; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; letter-spacing: 0.03em; }
  .score-item .score-bar-wrap { background: var(--purple-frost); border-radius: 99px; height: 5px; width: 100%; overflow: hidden; margin-bottom: 8px; }
  .score-item .score-bar { height: 5px; border-radius: 99px; background: var(--grad-main); transition: width 0.85s cubic-bezier(0.4,0,0.2,1); }
  .score-item .score-num { font-size: 0.78em; font-weight: 700; color: var(--purple-mid); }
  .score-item .score-num span { font-weight: 400; color: var(--text-muted); }

  /* ── Recommendation Cards ── */
  .rec-section-head {
    font-size: 0.88em;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 14px;
  }
  .rec-products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .rec-card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  .rec-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }

  /* Product image area */
  .rec-card-img-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--grad-soft);
    overflow: hidden;
    position: relative;
  }
  .rec-card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .rec-card:hover .rec-card-img-wrap img { transform: scale(1.04); }
  .rec-card-img-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5em;
    color: var(--purple-pale);
  }

  /* Concern badge overlaid on image */
  .rec-card-badge {
    position: absolute;
    top: 10px; left: 10px;
    background: var(--grad-main);
    color: #fff;
    font-size: 0.62em;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 20px;
  }

  /* Card body */
  .rec-card-body {
    padding: 14px 15px 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .rec-card-brand {
    font-size: 0.65em;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .rec-card-name {
    font-size: 0.82em;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.35;
    margin-bottom: 6px;
  }
  .rec-card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 10px;
  }
  .rec-card-tag {
    background: var(--purple-frost);
    color: var(--purple-mid);
    font-size: 0.65em;
    font-weight: 600;
    border-radius: 5px;
    padding: 2px 7px;
    letter-spacing: 0.04em;
  }
  .rec-card-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: auto;
    font-size: 0.72em;
    font-weight: 700;
    color: var(--purple-mid);
    letter-spacing: 0.05em;
    text-decoration: none;
    transition: color 0.2s;
  }
  .rec-card-link:hover { color: var(--purple-light); }
  .rec-card-link-arrow { font-size: 1em; }

  /* ── Empty state ── */
  .empty-state {
    width: 100%;
    text-align: center;
    padding: 52px 0 36px;
  }
  .empty-state-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: var(--grad-soft);
    border: 2px solid var(--border-soft);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 2.2em;
  }
  .empty-state h3 { font-size: 1.05em; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: -0.01em; }
  .empty-state p { font-size: 0.82em; line-height: 1.7; color: var(--text-muted); max-width: 280px; margin: 0 auto; }

  /* ── Raw JSON toggle ── */
  .raw-toggle-wrap {
    width: 100%;
    margin-top: 24px;
    border-top: 1px solid var(--border-soft);
    padding-top: 16px;
  }
  #raw-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.7em; font-weight: 600; color: var(--text-muted);
    cursor: pointer; letter-spacing: 0.07em; transition: color 0.2s; user-select: none;
  }
  #raw-toggle:hover { color: var(--purple-mid); }
  #raw-json {
    display: none;
    background: #130D2E; color: #C4B5FD;
    font-size: 0.72em;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    border-radius: 12px; padding: 16px; margin-top: 10px;
    overflow: auto; max-height: 280px; white-space: pre;
    border: 1px solid rgba(196,181,253,0.1); box-shadow: var(--shadow-sm);
  }

  /* ── No-rec placeholder ── */
  .no-rec-box { background: var(--purple-frost); border-radius: 14px; padding: 18px 22px; }
  .no-rec-box p { font-size: 0.82em; line-height: 1.7; color: var(--text-secondary); }

  .dev-hidden { display: none !important; }
</style>
</head>

    </div>

  </div>

</div>

/* ── Render ── */
function renderSkincareResult(report) {
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('results-divider').style.display = 'block';
  document.getElementById('skincare-result').style.display = 'block';

  /* Overview */
  var overviewEl = document.getElementById('sc-overview');
  var overviewHtml = '';
  if (report.skinHealth !== undefined) overviewHtml += overviewCard('Skin Health', report.skinHealth, '/ 100');
  if (report.skinAge     !== undefined) overviewHtml += overviewCard('Skin Age',    report.skinAge,    'years');
  if (report.skinType)                  overviewHtml += overviewCard('Skin Type',   report.skinType,   '');
  if (report.fitzpatrickScale)          overviewHtml += overviewCard('Fitzpatrick', 'Type ' + report.fitzpatrickScale, '');
  overviewEl.innerHTML = overviewHtml;
  var cardCount = overviewEl.querySelectorAll('.skin-overview-card').length;
  if (cardCount === 4) overviewEl.classList.add('four-cards');
  else overviewEl.classList.remove('four-cards');

  /* Concern scores */
  var gridHtml = '';
  Object.keys(SCORE_LABELS).forEach(function(key) {
    var val = report[key];
    if (val === undefined || val === null) return;
    gridHtml += scoreItem(SCORE_LABELS[key], parseFloat(val));
  });
  document.getElementById('sc-scores').innerHTML = gridHtml ||
    '<p style="color:var(--text-muted);font-size:0.82em;grid-column:1/-1;padding:12px 0;">No concern scores returned.</p>';

  /* Recommendations */
  var recSection = document.getElementById('sc-recommendation');
  if (report.recommendation && report.recommendation.products && report.recommendation.products.length > 0) {
    var recHtml = '';
    report.recommendation.products.forEach(function(p) {
      var db   = PRODUCT_DB[p.productId] || null;
      var name  = db ? db.name  : ('Product #' + p.productId);
      var brand = db ? db.brand : '';
      var img   = db ? db.image : '';
      var url   = db ? db.url   : null;
      var pid   = db ? db.pid   : (p.upc || '');

      /* image or placeholder */
      var imgContent = img
        ? '<img src="' + img + '" alt="' + name + '" onerror="this.parentNode.innerHTML=\'<div class=rec-card-img-placeholder>✦</div>\'">'
        : '<div class="rec-card-img-placeholder">✦</div>';

      /* source tags from SDK */
      var tagHtml = (p.sources || []).map(function(s) {
        return '<span class="rec-card-tag">' + s + '</span>';
      }).join('');

      /* link button */
      var linkHtml = url
        ? '<a class="rec-card-link" href="' + url + '" target="_blank" rel="noopener">View Product <span class="rec-card-link-arrow">→</span></a>'
        : '';

      recHtml +=
        '<div class="rec-card">' +
          '<div class="rec-card-img-wrap">' +
            imgContent +
            (pid ? '<span class="rec-card-badge">' + pid + '</span>' : '') +
          '</div>' +
          '<div class="rec-card-body">' +
            (brand ? '<div class="rec-card-brand">' + brand + '</div>' : '') +
            '<div class="rec-card-name">' + name + '</div>' +
            (tagHtml ? '<div class="rec-card-tags">' + tagHtml + '</div>' : '') +
            linkHtml +
          '</div>' +
        '</div>';
    });
    recSection.innerHTML =
      '<div class="rec-section-head">Recommended Products ' +
        '<span style="color:var(--purple-light);font-size:0.85em;">(' + report.recommendation.products.length + ')</span>' +
      '</div>' +
      '<div class="rec-products">' + recHtml + '</div>';
  } else {
    recSection.innerHTML =
      '<div class="no-rec-box"><p>No product recommendations returned.<br>' +
      '<span style="color:var(--text-muted);">Configure recommendation rules on Perfect Console to enable this.</span></p></div>';
  }

  document.getElementById('raw-json').textContent = JSON.stringify(report, null, 2);
}

function overviewCard(label, value, sub) {
  return '<div class="skin-overview-card">' +
    '<div class="label">' + label + '</div>' +
    '<div class="value">' + value + '</div>' +
    (sub ? '<div class="sub">' + sub + '</div>' : '') +
    '</div>';
}

function scoreItem(label, val) {
  var pct = Math.min(100, Math.max(0, val));
  return '<div class="score-item">' +
    '<div class="score-label">' + label + '</div>' +
    '<div class="score-bar-wrap"><div class="score-bar" style="width:' + pct + '%"></div></div>' +
    '<div class="score-num">' + val + ' <span>/ 100</span></div>' +
    '</div>';
}

/* ── SDK init ── */
window.ymkAsyncInit = function() {
  window.YMK.init({
    autoOpen: false,
    skincareFeatures: [
      'darkCircles', 'skinType', 'darkCirclesV2', 'moisture', 'oiliness', 'redness',
      'eyeBags', 'acne', 'ageSpots', 'texture', 'wrinkles', 'wrinklesV2',
      'firmness', 'radiance', 'pore'
    ],
  });

  window.YMK.addEventListener('videoLoaded',         function()  { console.log('videoLoaded'); });
  window.YMK.addEventListener('photoLoaded',         function()  { console.log('photoLoaded'); });
  window.YMK.addEventListener('shadeFinderComplete', function(r) { console.log('shadeFinderComplete', r); });

  window.YMK.addEventListener('skinAnalysisCompleted', function(report) {
    console.log('skinAnalysisCompleted', report);
    renderSkincareResult(report);
  });

  window.YMK.addEventListener('skinAnalysisUpdated', function(report) {
    console.log('skinAnalysisUpdated (fallback)', report);
    if (document.getElementById('skincare-result').style.display === 'none') {
      renderSkincareResult(report);
    }
  });
};

function applyMakeupManual() {
  YMK.applyMakeupBySku(document.getElementById('itemGuid').value);
}

function clearResult() {
  document.getElementById('skincare-result').style.display = 'none';
  document.getElementById('results-divider').style.display = 'none';
  document.getElementById('empty-state').style.display = 'block';
}
</script>

</body>
</html>
