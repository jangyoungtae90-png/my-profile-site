<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>31B-2 가구 배치</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#555; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; overflow:auto; }

    /* ── Drop zone ── */
    #drop-zone {
      display:flex; align-items:center; justify-content:center;
      min-height:100vh;
    }
    #drop-box {
      border:3px dashed rgba(255,255,255,.45); border-radius:20px;
      padding:60px 90px; text-align:center; color:#fff;
      background:rgba(255,255,255,.07);
      transition:background .2s, border-color .2s;
    }
    #drop-box.over { background:rgba(255,255,255,.17); border-color:rgba(255,255,255,.85); }
    #drop-box h2 { font-size:22px; margin-bottom:10px; }
    #drop-box p  { font-size:13px; opacity:.65; margin-top:8px; }
    #pick-btn {
      margin-top:18px; padding:10px 28px; font-size:14px;
      cursor:pointer; border-radius:8px; border:none;
      background:#4a90d9; color:#fff;
    }
    #pick-btn:hover { background:#357ab8; }

    /* ── Main ── */
    #main { display:none; }

    /* ── Control bar ── */
    #ctrl-bar {
      position:fixed; top:0; left:0; right:0; z-index:1000;
      background:rgba(18,18,36,.93); color:#fff;
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      padding:7px 14px; font-size:12px; backdrop-filter:blur(4px);
    }
    .hk {
      background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3);
      border-radius:3px; padding:1px 6px; font-family:monospace; font-size:11px;
    }
    .sep { opacity:.3; }
    #scale-row { display:flex; align-items:center; gap:6px; margin-left:auto; }
    #scale-slider { width:110px; cursor:pointer; }
    .cbtn {
      background:rgba(255,255,255,.14); color:#fff;
      border:1px solid rgba(255,255,255,.28); border-radius:6px;
      padding:4px 12px; font-size:12px; cursor:pointer;
    }
    .cbtn:hover { background:rgba(255,255,255,.24); }

    /* ── Scene ── */
    #scene-wrap { padding-top:40px; display:flex; justify-content:center; }
    #container { position:relative; display:inline-block; cursor:default; }

    #floor-img {
      display:block;
      max-width:none;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    #furn-layer {
      position:absolute; top:0; left:0; width:100%; height:100%;
      pointer-events:none;
    }

    /* ── Furniture ── */
    .furn {
      position:absolute;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      border:2px solid; border-radius:3px;
      cursor:grab; user-select:none;
      text-align:center; line-height:1.3;
      transform-origin:center center;
      pointer-events:all;
      transition:box-shadow .12s;
    }
    .furn:hover { box-shadow:0 0 0 2px rgba(0,160,255,.65); }
    .furn.sel   { box-shadow:0 0 0 3px #0090ff, 0 2px 14px rgba(0,110,255,.3); }
    .furn.dragging { cursor:grabbing; opacity:.85; }
    .furn .fname { font-weight:bold; pointer-events:none; }
    .furn .fdim  { opacity:.72; pointer-events:none; }

    /* ── Rotate button ── */
    .rot-btn {
      position:absolute; top:-26px; left:50%; transform:translateX(-50%);
      background:#0090ff; color:#fff; border:none; border-radius:12px;
      padding:2px 11px; font-size:11px; cursor:pointer;
      pointer-events:all; white-space:nowrap; z-index:10;
      box-shadow:0 1px 4px rgba(0,0,0,.3);
    }
    .rot-btn:hover { background:#006ecc; }

    /* ── Info panel ── */
    #info-panel {
      position:fixed; bottom:12px; right:12px; z-index:500;
      background:rgba(255,255,255,.95); border:1px solid #ccc;
      border-radius:10px; padding:11px 14px; font-size:11.5px;
      line-height:1.9; box-shadow:0 2px 8px rgba(0,0,0,.15);
      pointer-events:none;
    }
    #info-panel h3 { font-size:12px; margin-bottom:4px;
      border-bottom:1px solid #ddd; padding-bottom:3px; color:#333; }
    .il { color:#666; } .iv { font-weight:bold; }

    /* ── Selection bar ── */
    #sel-bar {
      position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:500;
      background:rgba(0,115,255,.9); color:#fff;
      border-radius:20px; padding:6px 18px; font-size:12px;
      display:none; pointer-events:none; white-space:nowrap;
    }
  </style>
</head>
<body>

<!-- Drop zone -->
<div id="drop-zone">
  <div id="drop-box">
    <h2>📂 평면도 이미지를 드래그&amp;드롭</h2>
    <p>JPG, PNG 등 이미지 파일을 이 페이지로 끌어다 놓으세요</p>
    <input type="file" id="file-input" accept="image/*" style="display:none">
    <button id="pick-btn">파일 선택</button>
    <p style="margin-top:18px;font-size:11px;opacity:.45;">
      또는 이 HTML과 같은 폴더에<br>floor-plan.png / floor-plan.jpg 파일을 저장 후 새로고침
    </p>
  </div>
</div>

<!-- Main view -->
<div id="main">
  <div id="ctrl-bar">
    <span><span class="hk">드래그</span> 이동</span>
    <span class="sep">|</span>
    <span><span class="hk">R</span> 또는 <span class="hk">⟳</span> 90° 회전</span>
    <span class="sep">|</span>
    <span><span class="hk">빈 곳 클릭</span> 해제</span>
    <div id="scale-row">
      가구크기&nbsp;<input type="range" id="scale-slider" min="0.01" max="0.6" step="0.001" value="0.12">
      &nbsp;<span id="scale-disp" style="min-width:70px">—</span>
    </div>
    <button class="cbtn" onclick="resetAll()">↺ 초기화</button>
  </div>

  <div id="scene-wrap">
    <div id="container">
      <img id="floor-img" alt="평면도">
      <div id="furn-layer"></div>
    </div>
  </div>

  <div id="info-panel">
    <h3>🏠 31B-2 · 31.43㎡</h3>
    <div><span class="il">🛏 침대&nbsp;</span><span class="iv">1,600 × 2,000 mm</span></div>
    <div><span class="il">🛋 소파&nbsp;</span><span class="iv">2,000 × 900 mm</span></div>
    <div><span class="il">☕ 커피테이블&nbsp;</span><span class="iv">1,100 × 550 mm</span></div>
    <div><span class="il">💻 책상&nbsp;</span><span class="iv">1,200 × 600 mm</span></div>
  </div>

  <div id="sel-bar"></div>
</div>

<script>
'use strict';

/* ── 가구 정의 ── */
const DEFS = [
  { id:'bed',  label:'🛏 침대',       wMM:1600, hMM:2000, bg:'rgba(184,212,240,0.82)', bc:'#5588bb' },
  { id:'sofa', label:'🛋 소파',       wMM:2000, hMM:900,  bg:'rgba(212,184,240,0.82)', bc:'#8855bb' },
  { id:'ct',   label:'☕ 커피',       wMM:1100, hMM:550,  bg:'rgba(240,228,184,0.82)', bc:'#bb9955' },
  { id:'desk', label:'💻 책상',       wMM:1200, hMM:600,  bg:'rgba(184,240,212,0.82)', bc:'#55bb88' },
];

let SC = 0.12;     // px per mm
let furns = [];    // [{ def, cx, cy, rot }]
let initPos = [];  // saved for reset
let selId = null;
let dragState = null;

const layer     = document.getElementById('furn-layer');
const container = document.getElementById('container');
const floorImg  = document.getElementById('floor-img');
const selBar    = document.getElementById('sel-bar');
const scaleSlider = document.getElementById('scale-slider');
const scaleDisp   = document.getElementById('scale-disp');

/* ── Image Loading ── */
function loadImageSrc(src) {
  floorImg.onload = () => {
    const W = floorImg.naturalWidth;
    const H = floorImg.naturalHeight;

    // Auto-scale: assume room width ~6100mm fills ~70% of image width
    SC = (W * 0.7) / 6100;
    SC = Math.min(0.5, Math.max(0.04, SC));
    scaleSlider.value = SC;
    updateScaleDisp();

    // Spread furniture across image initially
    furns = DEFS.map((def, i) => ({
      def,
      cx: W * 0.15 + i * (W * 0.2),
      cy: H * 0.45,
      rot: 0,
    }));
    initPos = furns.map(f => ({ cx: f.cx, cy: f.cy }));

    renderAll();
    document.getElementById('drop-zone').style.display = 'none';
    document.getElementById('main').style.display = 'block';
  };
  floorImg.onerror = () => {};
  floorImg.src = src;
}

/* Try floor-plan.png / .jpg automatically */
function tryAutoLoad(names, idx) {
  if (idx >= names.length) return;
  const t = new Image();
  t.onload  = () => loadImageSrc(names[idx]);
  t.onerror = () => tryAutoLoad(names, idx + 1);
  t.src = names[idx] + '?nc=' + Date.now();
}
tryAutoLoad(['floor-plan.png', 'floor-plan.jpg', 'floorplan.png', 'floorplan.jpg'], 0);

/* File input */
document.getElementById('pick-btn').onclick = () =>
  document.getElementById('file-input').click();
document.getElementById('file-input').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => loadImageSrc(ev.target.result);
  reader.readAsDataURL(file);
};

/* Drag & drop image onto page */
const dropBox = document.getElementById('drop-box');
document.addEventListener('dragover', e => {
  e.preventDefault();
  dropBox.classList.add('over');
});
document.addEventListener('dragleave', e => {
  if (!e.relatedTarget) dropBox.classList.remove('over');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  dropBox.classList.remove('over');
  const file = e.dataTransfer.files[0];
  if (!file?.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = ev => loadImageSrc(ev.target.result);
  reader.readAsDataURL(file);
});

/* ── Scale Slider ── */
scaleSlider.oninput = () => {
  SC = parseFloat(scaleSlider.value);
  updateScaleDisp();
  renderAll();
};

function updateScaleDisp() {
  scaleDisp.textContent = (1 / SC).toFixed(0) + ' mm/px';
}

/* ── Render All ── */
function renderAll() {
  layer.innerHTML = '';
  furns.forEach(f => { f.div = buildDiv(f); });
}

function buildDiv(f) {
  const wPx = f.def.wMM * SC;
  const hPx = f.def.hMM * SC;
  const fs   = Math.max(8, Math.min(13, wPx / 7));

  const div = document.createElement('div');
  div.className = 'furn' + (selId === f.def.id ? ' sel' : '');
  div.style.cssText = [
    `width:${wPx}px`, `height:${hPx}px`,
    `left:${f.cx - wPx / 2}px`, `top:${f.cy - hPx / 2}px`,
    `background:${f.def.bg}`,
    `border-color:${f.def.bc}`,
    `transform:rotate(${f.rot}deg)`,
    `font-size:${fs}px`,
  ].join(';');

  const rotated = (f.rot === 90 || f.rot === 270);
  const dispW = rotated ? f.def.hMM : f.def.wMM;
  const dispH = rotated ? f.def.wMM : f.def.hMM;

  div.innerHTML =
    `<span class="fname">${f.def.label}</span>` +
    `<span class="fdim">${dispW}×${dispH}</span>`;

  if (selId === f.def.id) {
    const btn = document.createElement('button');
    btn.className = 'rot-btn';
    btn.textContent = '⟳ 회전';
    btn.addEventListener('pointerdown', e => e.stopPropagation());
    btn.addEventListener('click', e => { e.stopPropagation(); rotate(f.def.id); });
    div.appendChild(btn);
  }

  div.addEventListener('pointerdown', e => startDrag(e, f));
  div.addEventListener('click',       e => e.stopPropagation());

  layer.appendChild(div);
  return div;
}

function updateFurnDiv(f) {
  if (!f.div) return;
  const wPx = f.def.wMM * SC;
  const hPx = f.def.hMM * SC;
  f.div.style.left = (f.cx - wPx / 2) + 'px';
  f.div.style.top  = (f.cy - hPx / 2) + 'px';
}

/* ── Drag ── */
function startDrag(e, f) {
  e.stopPropagation();
  e.preventDefault();

  const wasSel = (selId === f.def.id);
  selId = f.def.id;
  renderAll(); // show rotate button

  const startX  = e.clientX;
  const startY  = e.clientY;
  const startCx = f.cx;
  const startCy = f.cy;
  let moved = false;

  function onMove(ev) {
    moved = true;
    f.cx = startCx + ev.clientX - startX;
    f.cy = startCy + ev.clientY - startY;
    updateFurnDiv(f);
  }

  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup',   onUp);
    dragState = null;
    if (f.div) f.div.classList.remove('dragging');
    updateSelBar(f);
  }

  dragState = f;
  if (f.div) f.div.classList.add('dragging');
  updateSelBar(f);

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup',   onUp);
}

/* ── Rotate ── */
function rotate(id) {
  const f = furns.find(f => f.def.id === id);
  if (!f || !f.div) return;
  f.rot = (f.rot + 90) % 360;
  f.div.style.transform = `rotate(${f.rot}deg)`;

  const rotated = (f.rot === 90 || f.rot === 270);
  const dispW = rotated ? f.def.hMM : f.def.wMM;
  const dispH = rotated ? f.def.wMM : f.def.hMM;
  const fdim = f.div.querySelector('.fdim');
  if (fdim) fdim.textContent = `${dispW}×${dispH}`;
}

/* ── Selection bar ── */
function updateSelBar(f) {
  selBar.style.display = 'block';
  selBar.textContent   = `${f.def.label} 선택됨  ·  R 키 또는 ⟳ 버튼으로 회전`;
}

/* ── Deselect on background click ── */
container.addEventListener('click', e => {
  if (!e.target.closest('.furn')) {
    selId = null;
    selBar.style.display = 'none';
    renderAll();
  }
});

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && selId) {
    rotate(selId);
    return;
  }
  if (e.key === 'Escape') {
    selId = null;
    selBar.style.display = 'none';
    renderAll();
  }
});

/* ── Reset ── */
function resetAll() {
  furns.forEach((f, i) => {
    f.cx  = initPos[i]?.cx ?? f.cx;
    f.cy  = initPos[i]?.cy ?? f.cy;
    f.rot = 0;
  });
  selId = null;
  selBar.style.display = 'none';
  renderAll();
}
</script>
</body>
</html>
